name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows, like the real setup (Task Scheduler, claude.exe path).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q jobalerts tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Check the task scripts parse
        shell: pwsh
        run: |
          foreach ($f in "setup_tasks.ps1", "setup_dashboard_task.ps1", "schedule_task.ps1", "setup_boot_notice.ps1") {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD\$f", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$f : $($_.Message)" }; exit 1 }
          }
